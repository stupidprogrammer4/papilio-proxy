[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "--strict-config --strict-markers"
markers = ["installed: full isolated Compose install/browser/backup/restore lifecycle"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["papilio_installer", "tests", "papilio.py", "package_release.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
extraPaths = [".."]
venvPath = ".."
venv = ".venv"
