x-application: &application
  image: ${PAPILIO_PROJECT:?project required}-backend:${PAPILIO_VERSION:-local}
  build:
    context: .
    dockerfile: deployment/backend.Dockerfile
  env_file: ${PAPILIO_ENV_FILE:?private runtime environment required}
  restart: unless-stopped
  stop_grace_period: ${PAPILIO_SHUTDOWN_SECONDS:-120}s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: papilio_admin
      POSTGRES_DB: papilio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database administrator password required}
      PAPILIO_DB_PASSWORD: ${PAPILIO_DB_PASSWORD:?application database password required}
    volumes:
      - ${PAPILIO_STATE_ROOT:?}/postgres:/var/lib/postgresql/data
      - ./deployment/postgres-init.sh:/docker-entrypoint-initdb.d/10-papilio.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U papilio_admin -d papilio"]
      interval: 3s
      timeout: 5s
      retries: 40
  redis:
    image: redis:8-bookworm
    restart: unless-stopped
    environment:
      PAPILIO_REDIS_PASSWORD: ${PAPILIO_REDIS_PASSWORD:?cache password required}
      REDISCLI_AUTH: ${PAPILIO_REDIS_PASSWORD:?}
    command: [sh, -c, 'exec redis-server --requirepass "$$PAPILIO_REDIS_PASSWORD" --save "" --appendonly no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 5s
      retries: 40
  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?broker password required}
    volumes:
      - ${PAPILIO_STATE_ROOT:?}/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 40
  api:
    <<: *application
    environment:
      WEB_CONCURRENCY: ${PAPILIO_WEB_WORKERS:-2}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker-io:
    <<: *application
    command: [python, manage.py, worker, --kind, io]
  worker-cpu:
    <<: *application
    command: [python, manage.py, worker, --kind, cpu]
  beat:
    <<: *application
    # A fixed container name prevents a second scheduler for this host/instance.
    container_name: ${PAPILIO_PROJECT:?}-beat
    command: [celery, -A, "papilio_panel.config.celery:app", beat, --loglevel=INFO, --pidfile=/tmp/beat.pid]
  gateway:
    image: ${PAPILIO_PROJECT:?}-frontend:${PAPILIO_VERSION:-local}
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    restart: unless-stopped
    environment:
      PAPILIO_SITE_ADDRESS: ${PAPILIO_SITE_ADDRESS:?}
      PAPILIO_TRANSPORT_SCHEME: ${PAPILIO_TRANSPORT_SCHEME:?}
      PAPILIO_PUBLIC_ORIGIN: ${PAPILIO_PUBLIC_ORIGIN:?}
    ports:
      - ${PAPILIO_BIND_ADDRESS:?}:${PAPILIO_HTTP_PORT:?}:80
    volumes:
      - ${PAPILIO_STATE_ROOT:?}/caddy:/data
      - ${PAPILIO_STATE_ROOT:?}/caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
