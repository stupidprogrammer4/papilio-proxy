[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "papilio-proxy"
version = "0.1.0"
description = "Persian Telegram subscription service"
requires-python = ">=3.13"
dependencies = [
  "papilio[server] @ https://codeload.github.com/stupidprogrammer4/papilio/tar.gz/e026dbc9aa335ab4f6cc79f7ff2aecb198bd93ad",
  "papilio-tasks[scheduler] @ https://codeload.github.com/stupidprogrammer4/papilio-tasks/tar.gz/bca239763eab5c0d176b5ac8af9e878edb6997a7",
  "aiogram>=3.0,<4.0",
  "aiomysql>=0.2,<1.0",
  "cryptography>=44.0,<47.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "qrcode[pil]>=8.2,<9.0",
  "rich>=13.0,<15.0",
  "SQLAlchemy[asyncio]>=2.0,<3.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400,<2.0",
  "paramiko>=3.5,<5.0",
  "ruff>=0.12,<1.0",
  "zxing-cpp>=2.3,<4.0",
]
[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
target-version = "py313"
line-length = 100
