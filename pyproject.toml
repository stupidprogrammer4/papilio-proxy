[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "papilio"
version = "0.1.0"
description = "Persian Telegram subscription service"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.0,<4.0",
  "aiomysql>=0.2,<1.0",
  "cryptography>=44.0,<47.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "rich>=13.0,<15.0",
  "SQLAlchemy[asyncio]>=2.0,<3.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400,<2.0",
  "ruff>=0.12,<1.0",
]
[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
target-version = "py313"
line-length = 100
