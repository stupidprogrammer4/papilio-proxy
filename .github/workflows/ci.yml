name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: papilio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      PAPILIO_TEST_DATABASE_URL: mysql+aiomysql://root:ci-password@127.0.0.1:3306/papilio_test
      PAPILIO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      NATS_TEST_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: panel/backend/pyproject.toml
      - name: Install backend and development dependencies
        working-directory: panel/backend
        run: |
          python -m pip install --editable '.[dev]'
          python -m pip install --editable ../../bot
      - name: Lint backend
        working-directory: panel/backend
        run: |
          ruff check src tests scripts migrations
          ruff format --check src tests scripts migrations
      - name: Start isolated NATS JetStream
        run: |
          docker run --detach --name papilio-ci-nats \
            --publish 4222:4222 --publish 8222:8222 \
            nats:2.15.1-alpine -js -m 8222
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs papilio-ci-nats
          exit 1
      - name: Run backend workflows
        working-directory: panel/backend
        run: python -m pytest -q
      - name: Remove isolated NATS JetStream
        if: always()
        run: docker rm --force papilio-ci-nats || true

  bot:
    name: Telegram adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - name: Install bot and verification dependencies
        working-directory: bot
        run: python -m pip install --upgrade pip ruff pyright pytest && python -m pip install --editable .
      - name: Lint and type-check bot
        working-directory: bot
        run: |
          ruff check papilio_telegram tests
          ruff format --check papilio_telegram tests
          pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" papilio_telegram tests
      - name: Run bot tests
        working-directory: bot
        run: python -m pytest -q

  frontend:
    name: Panel build and browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAPILIO_BACKEND_URL: http://127.0.0.1:8000
      PAPILIO_PANEL_PORT: "4417"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: panel/frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: panel/frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Build panel
        working-directory: panel/frontend
        run: pnpm build
      - name: Run browser workflows
        working-directory: panel/frontend
        run: pnpm test:browser

  go:
    name: Go runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: proxy/go.mod
          cache: true
          cache-dependency-path: |
            proxy/go.sum
            proxy/engines/xray/go.sum
      - name: Test proxy runtime
        working-directory: proxy
        run: go test -count=1 ./...
      - name: Vet proxy runtime
        working-directory: proxy
        run: go vet ./...
      - name: Test managed Xray engine
        working-directory: proxy/engines/xray
        run: go test -count=1 ./...
      - name: Vet managed Xray engine
        working-directory: proxy/engines/xray
        run: go vet ./...
