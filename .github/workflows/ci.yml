name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  xray-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: node/agent
    env:
      PAPILIO_XRAY_BINARY: ${{ github.workspace }}/.ci/xray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: node/agent/go.sum
      - name: Fetch the verified official Xray baseline
        run: |
          python3 tools/fetch_test_xray.py
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: papilio_test
          POSTGRES_DB: papilio_test
          POSTGRES_PASSWORD: integration-only
        ports: ["5432/tcp"]
        options: --health-cmd "pg_isready -U papilio_test -d papilio_test" --health-interval 3s --health-timeout 5s --health-retries 40
      redis:
        image: redis:8-bookworm
        ports: ["6379/tcp"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 5s --health-retries 40
      rabbitmq:
        image: rabbitmq:4.3-management
        env:
          RABBITMQ_DEFAULT_USER: papilio_test
          RABBITMQ_DEFAULT_PASS: integration-only
        ports: ["5672/tcp"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 40
    env:
      PAPILIO_ENV: test
      PAPILIO_INSTANCE: ci
      PAPILIO_SECRET_KEY: ci-only-not-a-production-secret-key-000000000000000000000000000000
      PAPILIO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PAPILIO_AUTH_RATE: 10000/min
      PYTHONPATH: ${{ github.workspace }}/panel/backend/src
      PAPILIO_XRAY_BINARY: ${{ github.workspace }}/.ci/xray
      PAPILIO_AGENT_BINARY: ${{ github.workspace }}/.ci/papilio-agent
      PAPILIO_RUN_SERVICE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: node/agent/go.sum
      - name: Build the actual node agent and fetch the verified core
        run: |
          python3 node/agent/tools/fetch_test_xray.py
          cd node/agent
          go build -o "$PAPILIO_AGENT_BINARY" ./cmd/papilio-agent
      - name: Configure test-owned integration connections
        env:
          DATABASE_URL: postgresql://papilio_test:integration-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/papilio_test
          PAPILIO_CACHE_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
          CELERY_BROKER_URL: amqp://papilio_test:integration-only@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}//
          PAPILIO_TEST_BROKER_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name in ("DATABASE_URL", "PAPILIO_CACHE_URL", "CELERY_BROKER_URL", "PAPILIO_TEST_BROKER_CONTAINER"):
                  output.write(f"{name}={os.environ[name]}\n")
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: panel/backend/requirements.dev.lock
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r panel/backend/requirements.dev.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "9.15.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: panel/frontend/pnpm-lock.yaml
      - run: pnpm --dir panel/frontend install --frozen-lockfile
      - run: pnpm --dir panel/frontend exec playwright install --with-deps chromium
      - run: pnpm --dir panel/frontend build
      - run: .venv/bin/ruff check panel/backend deployment
      - run: .venv/bin/ruff format --check panel/backend deployment
      - run: .venv/bin/pyright -p panel/backend
      - run: .venv/bin/pyright -p deployment
      - run: .venv/bin/python panel/backend/manage.py makemigrations --check --dry-run
      - run: .venv/bin/python panel/backend/manage.py spectacular --validate --fail-on-warn --file /tmp/papilio-openapi.yml
      - run: .venv/bin/pytest -c panel/backend/pyproject.toml panel/backend/tests -q
      - run: .venv/bin/pytest -c deployment/pyproject.toml deployment/tests -m 'not installed' -q
      - run: bash -n install.sh

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAPILIO_RUN_INSTALLER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Verify native containerd image storage
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          facts = json.loads(subprocess.check_output(["docker", "info", "--format", "{{json .DriverStatus}}"], text=True))
          assert dict(facts or []).get("driver-type") == "io.containerd.snapshotter.v1"
          PYCODE
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "9.15.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: panel/frontend/pnpm-lock.yaml
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r panel/backend/requirements.dev.lock
      - run: pnpm --dir panel/frontend install --frozen-lockfile
      - run: pnpm --dir panel/frontend exec playwright install --with-deps chromium
      - run: pnpm --dir panel/frontend build
      - name: Record native container tool versions
        run: |
          docker version --format '{{.Client.Version}} / {{.Server.Version}}'
          docker compose version
      - run: .venv/bin/pytest -c deployment/pyproject.toml deployment/tests/test_installed_runtime.py deployment/tests/test_image_runtime.py -q

  installer-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -c deployment/pyproject.toml deployment/tests -m 'not installed' -q
