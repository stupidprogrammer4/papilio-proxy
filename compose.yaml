name: papilio

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["python", "-m", "bot.app"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]

  tui:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["python", "-m", "bot.tools.dashboard_tui"]
    profiles: [admin]
    stdin_open: true
    tty: true
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: papilio
      MYSQL_USER: papilio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set-a-dedicated-password-in-.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set-a-dedicated-root-password-in-.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [private]

networks:
  private: {}

volumes:
  mysql_data:

