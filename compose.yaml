name: papilio

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    group_add: ["10001"]
    command: ["python", "-m", "bot.app"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data/node:/run/papilio
    networks: [private]

  callback:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    group_add: ["10001"]
    volumes:
      - ./data/node:/run/papilio
    command: ["uvicorn", "bot.callback:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]

  xray:
    image: ghcr.io/xtls/xray-core@sha256:592ec4d11f656db95598d01e76dbcc6e002d67360b96a5436500a938230f52c7
    entrypoint: ["/usr/local/bin/papilio-proxy"]
    command: ["serve"]
    environment:
      PAPILIO_HYSTERIA_CONFIG: /etc/hysteria/node.json
    user: "65532:10001"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data/xray/config.json:/etc/xray/config.json:ro
      - ./data/xray/papilio-proxy:/usr/local/bin/papilio-proxy:ro
      - ./data/node:/run/papilio
      - ./data/xray/certs:/etc/xray/certs:ro
      - ./data/hysteria/node.json:/etc/hysteria/node.json:ro
      - ./data/hysteria/server.json:/etc/hysteria/server.json:ro
      - ./data/hysteria/hysteria:/usr/local/bin/hysteria:ro
    restart: unless-stopped
    mem_limit: 512m

  tui:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["python", "-m", "bot.tools.dashboard_tui"]
    profiles: [admin]
    stdin_open: true
    tty: true
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: papilio
      MYSQL_USER: papilio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set-a-dedicated-password-in-.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set-a-dedicated-root-password-in-.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [private]

networks:
  private: {}

volumes:
  mysql_data:
