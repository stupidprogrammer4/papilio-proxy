[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "papilio-panel"
version = "0.1.0a3"
description = "Independent, integrated proxy management and commerce panel"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<8",
  "celery>=5.6,<5.7",
  "django-celery-beat>=2.8,<3",
  "gunicorn>=23,<26",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.11,<5",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.12,<1",
  "pyright>=1.1.400,<2",
  "django-stubs>=5.2,<6",
  "djangorestframework-stubs>=3.16,<4",
  "types-redis>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "papilio_panel.config.settings"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["runtime: real Celery/Beat/broker integration", "installer: isolated installer/CLI behavior"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "../.."
venv = ".venv"
